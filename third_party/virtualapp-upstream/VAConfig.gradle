import java.text.SimpleDateFormat

ext {

    PACKAGE_NAME                = "com.carlos.multiapp"
    EXT_PACKAGE_NAME            = "com.carlos.multiapp.ext"


    VA_MAIN_PACKAGE_32BIT       = false
    VA_ACCESS_PERMISSION_NAME   = "com.carlos.multiapp.permission.SAFE_ACCESS"
    VA_AUTHORITY_PREFIX         = "com.carlos.multiapp"
    VA_EXT_AUTHORITY_PREFIX     = "com.carlos.multiapp"
    VA_VERSION                  = '2.3.2'
    VA_VERSION_CODE             = 23202
    VA_FULL_EXT                 = true //如果这个是true ,那么将32里面的一些代码都会打包到插件apk 里面来

    // BYBUS uses the host app's ignored local signing configuration.
    signing_storeFile           = System.getenv("VIRTUALAPP_SIGNING_STORE") ?: ""
    signing_storePassword       = System.getenv("VIRTUALAPP_SIGNING_STORE_PASSWORD") ?: ""
    signing_keyAlias            = System.getenv("VIRTUALAPP_SIGNING_ALIAS") ?: ""
    signing_keyPassword         = System.getenv("VIRTUALAPP_SIGNING_KEY_PASSWORD") ?: ""
}
